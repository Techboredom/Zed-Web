; This replaces the whole /etc/supervisor/supervisord.conf (not just
; conf.d/) so every path below can live in /tmp instead of root-owned
; /var/run and /var/log/supervisor: entrypoint.sh drops the whole
; supervisord process tree to the zed user via `setpriv --keep-groups`
; (not per-program user= — that resets supplementary groups, which
; breaks NVIDIA's /dev/dri/card1 access when --group-add keep-groups
; was used at the container level; see README's NVIDIA section).

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:sway]
; --unsupported-gpu: sway's Nvidia check reads /proc/modules, which is not
; namespaced by the container and so sees Nvidia's driver loaded on hosts
; that have one, even when only the Intel /dev/dri node was passed through.
; Safe here because the compose file restricts the device to Intel only.
command=/usr/bin/sway --unsupported-gpu
autorestart=true
priority=100
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wayvnc]
; Loopback-only: wayvnc's own auth uses a security type noVNC can't speak,
; so auth is enforced one layer up by websockify/BasicHTTPAuth instead.
; Don't rebind this to 0.0.0.0 without adding equivalent protection.
command=/usr/bin/wayvnc 127.0.0.1 %(ENV_VNC_PORT)s
autorestart=true
priority=200
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_AUTH_ARGS)s %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=300
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
