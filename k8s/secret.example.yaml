# Copy this to secret.yaml (gitignored - never commit real credentials),
# fill in a real password, and `kubectl apply -f secret.yaml`. Or skip the
# file entirely and run:
#   kubectl create secret generic zed-web-auth \
#     --from-literal=VNC_USERNAME=zed \
#     --from-literal=VNC_PASSWORD='<a real password>'
apiVersion: v1
kind: Secret
metadata:
  name: zed-web-auth
type: Opaque
stringData:
  VNC_USERNAME: zed
  VNC_PASSWORD: changeme
