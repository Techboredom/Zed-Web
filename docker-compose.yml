services:
  zed:
    build: .
    image: zed-web:latest
    ports:
      - "6080:6080"   # browser: http://localhost:6080 (only port meant to be published)
    devices:
      # Pass through ONLY your Intel GPU's card + render nodes, not the whole
      # /dev/dri directory (a multi-GPU host would otherwise also expose any
      # NVIDIA/AMD cards). Find the right pair with:
      #   lspci -nnk | grep -A2 -i vga         # identify the Intel PCI address
      #   ls -l /dev/dri/by-path/               # map it to cardN / renderDNNN
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD129:/dev/dri/renderD129
      # NVIDIA instead? Swap the two lines above for:
      #   - nvidia.com/gpu=all
      # ...and see the README's NVIDIA section first: it needs the NVIDIA
      # Container Toolkit on the host, and on rootless Podman (this tool's
      # default, no sudo) it's confirmed NOT to work regardless of device
      # passthrough - use `sudo podman compose` / rootful Docker instead.
      #
      # No GPU / on macOS or Windows? Delete this whole `devices:` block.
      # Falls back to software rendering automatically - works anywhere,
      # just slower. See the README's "Software rendering" section.
    environment:
      - VNC_PASSWORD=changeme   # required for auth; change this
      - VNC_USERNAME=zed
    volumes:
      - ./workspace:/workspace                # your project files
      - zed-config:/home/zed/.config/zed       # editor settings
      - zed-data:/home/zed/.local/share/zed    # extensions, state
      # Prefer one volume for the whole of /home/zed instead (matching
      # k8s/deployment.yaml) - e.g. to get rustup/uv/npm-global tool
      # installs persisted too, not just Zed's own settings/extensions?
      # Replace the three lines above with:
      #   - ./workspace:/workspace
      #   - zed-home:/home/zed
      # ...and add `zed-home:` under the `volumes:` section below. Works
      # with either a named volume (auto-populated from the image the
      # first time it's created, so nothing else to do) or a bind mount to
      # a real host folder instead (`- /path/on/host:/home/zed` - starts
      # empty; entrypoint.sh detects that and restores zed/rustup/uv/
      # npm-global tools from what's baked into the image, same mechanism
      # k8s's PVC needs and this doesn't strictly - see the README's
      # Kubernetes section for why). Optionally also set
      # ZED_WORKSPACE_DIR=/home/zed/workspace and drop the separate
      # ./workspace bind mount, if you'd rather project files live inside
      # that single volume too instead of their own mount.

volumes:
  zed-config:
  zed-data:
  # zed-home:   # only if you switched to the single-volume pattern above
